name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must match the crate version in Cargo.toml; otherwise the
  # packages and crates.io publish would carry the wrong version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$ver" ]; then
            echo "tag $tag does not match Cargo.toml version $ver"
            exit 1
          fi

  # Build the Linux bundles (AppImage + .deb) for the tag and attach them
  # to the GitHub Release.
  binaries:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev
      - name: Build release
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --release
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        run: cargo packager --release
        # linuxdeploy's bundled strip chokes on libraries that use newer
        # ELF relocations (.relr.dyn); skip stripping the bundled libs.
        env:
          NO_STRIP: "true"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/*.AppImage
            target/release/*.deb
          generate_release_notes: true
          # Semver prerelease tags (v0.2.0-beta.1) must not become "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Build the Windows installer (NSIS setup.exe) and attach it to the same
  # GitHub Release for the tag.
  binaries-windows:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --release
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        run: cargo packager --release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/*-setup.exe
          generate_release_notes: true
          # Semver prerelease tags (v0.2.0-beta.1) must not become "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Build the macOS bundle (a universal .app plus .dmg covering both
  # Apple Silicon and Intel) and attach it to the same GitHub Release
  # for the tag. cargo-packager signs the .app inside-out with the
  # Developer ID named in Cargo.toml (certificate from the
  # APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD secrets), then notarizes
  # and staples it using an App Store Connect API key (APPLE_API_KEY,
  # APPLE_API_ISSUER, and the .p8 contents in APPLE_API_KEY_P8). It signs
  # the .dmg but does not notarize it, so that is done separately.
  binaries-macos:
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin
      - name: Build Intel binary
        run: cargo build --verbose --release --target x86_64-apple-darwin
      - name: Build ARM64 binary
        run: cargo build --verbose --release --target aarch64-apple-darwin
      - name: Test
        run: cargo test --release
      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/spacefinder \
            target/aarch64-apple-darwin/release/spacefinder \
            -output target/release/spacefinder
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      # cargo-packager silently skips notarization when credentials are
      # missing, so fail early instead of releasing an un-notarized build.
      - name: Package
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                     APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!var}" ]; then
              echo "::error::secret $var is not set"
              exit 1
            fi
          done
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          cargo packager --release
      - name: Rename dmg for universal binary
        run: |
          for dmg in target/release/*.dmg; do
            mv "$dmg" "${dmg%_*.dmg}_universal.dmg"
          done
      - name: Notarize and staple dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          auth=(--key "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
                --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          for dmg in target/release/*.dmg; do
            out=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json)
            echo "$out"
            if [ "$(jq -r .status <<<"$out")" != Accepted ]; then
              xcrun notarytool log "$(jq -r .id <<<"$out")" "${auth[@]}"
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done
      - name: Verify Gatekeeper acceptance
        run: |
          spctl --assess --type execute --verbose=2 target/release/Space.app
          for dmg in target/release/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/*.dmg
          generate_release_notes: true
          # Semver prerelease tags (v0.2.0-beta.1) must not become "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publish to crates.io using Trusted Publishing (OIDC, no stored token).
  # One-time setup required on crates.io: add a Trusted Publisher for this
  # crate pointing at repo bjorn/spacefinder, workflow release.yml. Until
  # that is configured (and for the very first publish, which reserves the
  # name), publish manually with `cargo publish`.
  crate:
    needs: check
    # Prerelease tags (v0.2.0-beta.3) only produce GitHub release binaries.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Gate crate publishing behind the "release" environment. Configure it
    # under Settings > Environments with required reviewers so each publish
    # needs manual approval, and reference the same environment name in the
    # crates.io Trusted Publisher config.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
